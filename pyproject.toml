[project]
name = "esg-cleanvest-streamlit-v1"
version = "0.1.0"
description = "Explorative Auswertung von CLEANVEST-Fondsdaten."
authors = [
    {name = "Can Kuyucu"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit (>=1.58.0,<2.0.0)",
    "certifi (>=2026.10.19)", # GHSA-6q48-6c7w-9gw2: drop compromised emSign root
    "openpyxl (>=3.1.5,<4.0.0)",
    "plotly (>=6.8.0,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "requests (>=2.34.2,<3.0.0)",
    "forex-python (>=1.9.2,<2.0.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "torch (>=2.0.0,<3.0.0)",
    "accelerate (>=1.14.0,<2.0.0)",
    "torchvision (>=0.28.0,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false